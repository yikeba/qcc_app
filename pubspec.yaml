name: qcc_flutter
description: "Qcc_Wallet"
version: 0.8.2
homepage:

environment:
  sdk: ^3.11.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  flutter_lints: ^6.0.0
  encrypt: ^5.0.3
  crypto: ^3.0.3
  translator: ^1.0.4+1  #免费翻译插件
  pointycastle: ^3.9.1  # 加密库
  bs58: ^1.0.2     #base58编码插件
  convert: ^3.1.1
  bip39: ^1.0.6
      # ✅ Dilithium 纯 Dart 实现，pub.dev 真实可用
    # 支持 Level2 / Level3 / Level5（即 Dilithium5）
    # https://pub.dev/packages/dilithium_crypto
    # dilithium_crypto: ^1.0.2
  liboqs: ^1.2.0    #
  flutter_secure_storage: ^10.0.0
    # FFI（如果选择 liboqs 方案）
  ffi: ^2.1.0
  url_launcher: ^6.3.2
  file_picker: ^10.3.10
  image_picker: ^1.2.1
  shared_preferences: ^2.5.4
  qr_flutter: ^4.1.0
  path_provider: ^2.1.5
  pinput: ^4.0.0  #支付密码输入框
  device_info_plus: ^12.3.0
  archive: ^3.3.0   #暂时必须这个版本
  mobile_scanner: ^7.2.0
  flutter_chen_kchart: ^3.0.0  #dex图表
  intl: ^0.20.2
  dio: ^5.4.0
  html: ^0.15.6
  flutter_html: ^3.0.0
  flutter_inappwebview: ^6.1.5
  window_manager: ^0.5.2
  flutter_map: ^7.0.2 #8.3.1
  latlong2: ^0.9.1
  #package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:

  assets:
    - assets/qcc.png
    - assets/qcc.jpeg
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using method channels.
  # The Android 'package' specifies package in which the registered class is.
  # This is required for using method channels on Android.
  # The 'ffiPlugin' specifies that native code should be built and bundled.
  # This is required for using `dart:ffi`.
  # All these are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: com.qcc.chain.qcc_flutter
        pluginClass: QccFlutterPlugin
      ios:
        pluginClass: QccFlutterPlugin
      linux:
        pluginClass: QccFlutterPlugin
      macos:
        pluginClass: QccFlutterPlugin
      windows:
        pluginClass: QccFlutterPluginCApi



  # To add assets to your plugin package, add an assets section, like this:
